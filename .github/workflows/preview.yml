name: Preview Help Center (PR)

# Builds and deploys a preview on every PR. Posts the preview URL as a
# PR comment so reviewers (including non-technical team members) can see
# the rendered site without running anything locally.
#
# SETUP REQUIRED:
# 1. Create a Cloudflare Pages project named "brande-help-center"
# 2. Add these repo secrets:
#    - CLOUDFLARE_API_TOKEN: API token with "Cloudflare Pages:Edit" permission
#    - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID
# 3. (Optional) Enable Cloudflare Access to restrict previews to team emails

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_PROJECT_NAME: brande-help-center

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vitepress/dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.head_ref }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const body = `## Help Center Preview\n\nPreview deployed: **${url}**\n\nReview the rendered docs before approving this PR.\n\n_Auto-generated by the help center preview workflow._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Help Center Preview'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
